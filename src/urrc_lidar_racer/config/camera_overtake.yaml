camera_perception:
  ros__parameters:
    image_topic: /camera/image_raw
    road_confidence_min_area_ratio: 0.08

    # 5등 신호등: 빨간색 면적이 아니라 실제 램프 개수로 판단
    start_gate_enable: true
    start_full_on_min_count: 4
    start_off_max_count: 1
    start_seen_frames: 3
    start_off_frames: 4
    lamp_roi_y_max_ratio: 0.48
    lamp_roi_x_min_ratio: 0.15
    lamp_roi_x_max_ratio: 0.85

overtake_fusion:
  ros__parameters:
    raw_cmd_topic: /race/lidar_cmd_vel
    final_cmd_topic: /model/urrc_car/cmd_vel
    scan_topic: /scan
    rear_scan_topic: /rear_scan
    wheelbase: 0.330
    camera_gain_deg: 5.5
    camera_min_confidence: 0.35
    camera_fallback_enable: true
    camera_fallback_speed_mps: 2.50
    camera_fallback_gain_scale: 1.35
    max_steer_deg: 28.0
    max_speed_mps: 10.00
    raw_cmd_timeout_sec: 0.35
    scan_timeout_sec: 0.40
    emergency_stop_m: 0.70
    hard_ttc_sec: 0.22
    reaction_time_sec: 0.20
    brake_decel_mps2: 10.0
    safety_margin_m: 0.40
    overtake_trigger_m: 8.00
    overtake_trigger_margin_m: 1.00
    overtake_front_clear_m: 8.00
    overtake_side_clear_m: 0.82
    overtake_abort_side_m: 0.55
    rear_return_clear_m: 1.20

    # 앞차 판별: 긴 벽/가드레일 대신 차량 크기 클러스터만 추월 대상으로 사용
    vehicle_cluster_gap_m: 0.18
    vehicle_min_width_m: 0.10
    vehicle_max_width_m: 0.60
    vehicle_max_depth_m: 0.75
    vehicle_min_points: 4
    vehicle_corridor_half_width_m: 0.70

    # 추월 측면 공간 + 연속 추월 방지
    pass_corridor_min_m: 0.78
    overtake_cooldown_sec: 1.50

    # 최종 명령 평활화
    final_accel_limit_mps2: 10.0
    final_decel_limit_mps2: 10.0
    final_steer_rate_deg_s: 110.0
    overtake_max_base_steer_deg: 8.0
    overtake_detect_hold_sec: 0.25
    shift_out_sec: 0.85
    pass_min_sec: 0.45
    return_sec: 0.95
    pass_lane_target: 0.30
    fallback_shift_bias_deg: 3.5
    fallback_return_bias_deg: 3.0
    shift_speed_mps: 8.00
    overtake_speed_mps: 10.00
    return_speed_mps: 8.00
    start_gate_enable: true
